name: App / Build

on:
  push:
    branches:
      - master
      - release-*
  pull_request:
  workflow_dispatch:

concurrency:
  group: app-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version-file: .tools-versions
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: Assemble debug APKs
        run: ./gradlew assembleDebug
      - name: Create publish bundle
        run: mkdir -p build/gh-app-publish/; find app/build/ -iname "*.apk" -exec mv "{}" build/gh-app-publish/ \;
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-artifacts
          retention-days: 14
          if-no-files-found: error
          path: build/gh-app-publish/
      - name: Publish latest APKs for guest download
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_title="Latest Build"
          release_notes="Automated debug APKs for commit $GITHUB_SHA."
          shopt -s nullglob
          apks=(build/gh-app-publish/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "No APK files found in build/gh-app-publish/"
            exit 1
          fi
          if gh release view latest-build >/dev/null 2>&1; then
            gh release delete latest-build --cleanup-tag --yes
          else
            # Clean up any existing latest-build tag before release creation.
            echo "Warning: latest-build release missing; cleaning up tag if present."
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/latest-build" >/dev/null 2>&1 || true
          fi
          gh release create latest-build \
            --target "$GITHUB_SHA" \
            --title "$release_title" \
            --notes "$release_notes" \
            --prerelease \
            "${apks[@]}"
